<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private checkout validation</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:20px}button{padding:12px;margin:6px}pre{white-space:pre-wrap;word-break:break-word;background:#eee;padding:15px}</style><h1>Private checkout validation</h1><p>Synthetic data only. Existing shop records are never read or changed. Only the configured owner can use this test.</p><p id="auth">Checking sign-in...</p><button id="signin">Sign in with Google</button><button id="seed">1. Create synthetic test data</button><button id="run">2. Run bounded checkout tests</button><button id="cleanup">3. Delete synthetic test data</button><pre id="out"></pre>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script><script>
const clamp=(x,l,h)=>Math.min(h,Math.max(l,x));
const money=x=>Math.round(Number(x)*100);
const roundDiv=(n,d)=>Math.floor((n+d/2)/d);
function calculate(state,cart,customer){
 const config=state.config,discountBp=customer?clamp(Math.round(customer.discPct*100),0,10000):0;
 const lines=cart.items.map(l=>{
  const p=state.catalog[l.pid],qty=l.qty;
  if(!p||!p.active||!Number.isSafeInteger(qty)||qty<1||qty>state.stock[l.pid])throw Error('Invalid stock/quantity');
  if(cart.mode==='wholesale'&&qty<p.moq)throw Error('MOQ');
  const unitPaise=cart.mode==='retail'?p.retailPaise:p.wholesalePaise;
  const grossPaise=unitPaise*qty;
  const itemDiscPaise=p.discType==='amt'?Math.min(p.discPaise*qty,grossPaise):roundDiv(grossPaise*clamp(p.discBp,0,10000),10000);
  return {pid:l.pid,qty,unitPaise,grossPaise,itemDiscPaise,netPaise:grossPaise-itemDiscPaise,taxBp:config.gstEnabled?p.taxBp:0};
 });
 const subPaise=lines.reduce((s,l)=>s+l.grossPaise,0),itemDiscPaise=lines.reduce((s,l)=>s+l.itemDiscPaise,0),netPaise=subPaise-itemDiscPaise;
 const custDiscPaise=roundDiv(netPaise*discountBp,10000),after=netPaise-custDiscPaise;
 const extraDiscPaise=clamp(cart.odType==='amt'?money(cart.odVal):roundDiv(after*clamp(Math.round(cart.odVal*100),0,10000),10000),0,after);
 const orderDiscPaise=custDiscPaise+extraDiscPaise;
 let allocated=0;lines.forEach((l,i)=>{const allocationPaise=Math.min(l.netPaise,netPaise>0?(i===lines.length-1?orderDiscPaise-allocated:roundDiv(orderDiscPaise*l.netPaise,netPaise)):0);allocated+=allocationPaise;l.allocationPaise=allocationPaise;l.taxablePaise=Math.max(0,l.netPaise-allocationPaise);l.taxPaise=roundDiv(l.taxablePaise*l.taxBp,10000);l.totalPaise=l.taxablePaise+l.taxPaise;});
 const taxablePaise=lines.reduce((s,l)=>s+l.taxablePaise,0),taxPaise=lines.reduce((s,l)=>s+l.taxPaise,0),rawPaise=taxablePaise+taxPaise,grandPaise=config.roundOff?Math.round(rawPaise/100)*100:rawPaise;
 return {lines,subPaise,itemDiscPaise,netPaise,discountBp,custDiscPaise,extraDiscPaise,orderDiscPaise,taxablePaise,taxPaise,rawPaise,roundOffPaise:grandPaise-rawPaise,grandPaise};
}


const cfg={apiKey:'AIzaSyDtplfGP-AmlVzSzu5Lzxjztnc6MB34Fq4',authDomain:'shree-festival-pos.firebaseapp.com',projectId:'shree-festival-pos',appId:'1:552632077785:web:68453eff10fff605401dc8'};firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore(),ROOT='stagingPos20261107/main',STATE=ROOT+'/control/state';
let serial=0;const log=m=>document.getElementById('out').textContent+=m+'\n';const stamp=()=>firebase.firestore.FieldValue.serverTimestamp();const customer={discPct:5,profile:{name:'Synthetic Test Customer',mobile:'0000000000'}};
auth.onAuthStateChanged(u=>document.getElementById('auth').textContent=u?'Signed in: '+u.email:'Sign in as owner to test');document.getElementById('signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
document.getElementById('seed').onclick=async()=>{try{const catalog={},stock={};for(let i=0;i<32;i++){catalog['p'+i]={active:true,moq:2,retailPaise:111+i*10,wholesalePaise:101+i*10,discType:i%2?'amt':'pct',discPaise:1,discBp:250,taxBp:i%3?1800:500};stock['p'+i]=10000;}await db.doc(STATE).set({catalog,stock,config:{gstEnabled:true,roundOff:true},nextSeq:1,lastSaleId:'none'});await db.doc(ROOT+'/customers/c1').set(customer);log('Synthetic seed saved.');}catch(e){log('Seed error: '+e.message)}};
async function sale(id,n,opts={},mutate){return db.runTransaction(async tx=>{const ref=db.doc(STATE),old=await tx.get(db.doc(ROOT+'/invoices/'+id));if(old.exists)return old.data();const b=(await tx.get(ref)).data(),a={...b,stock:{...b.stock},nextSeq:b.nextSeq+1,lastSaleId:id};const ids=Object.keys(b.catalog).slice(0,n),cart={mode:opts.mode||'retail',odType:opts.odType||'pct',odVal:opts.odVal||0,items:ids.map(pid=>({pid,qty:opts.qty||10}))},c=calculate(b,cart,opts.customer?customer:null),{lines,discountBp,...calc}=c;
const h={seq:b.nextSeq,n,buckets:Math.ceil(n/2),ids,mode:cart.mode,customerId:opts.customer?'c1':'',customer:opts.customer?structuredClone(customer.profile):{},odType:cart.odType,odVal:cart.odType=='pct'?Math.round(cart.odVal*100):money(cart.odVal),...calc,receivedPaise:c.grandPaise,paidPaise:c.grandPaise,balancePaise:0,changePaise:0,method:'Cash',ref:'',note:'',creator:auth.currentUser.uid,createdAt:stamp()};lines.forEach(l=>{a.stock[l.pid]-=l.qty;delete l.taxBp});if(mutate)mutate(h,lines,a);tx.set(ref,a);tx.set(db.doc(ROOT+'/invoices/'+id),h);let acc={runSub:0,runDisc:0,runTaxable:0,runTax:0,runAlloc:0};for(let i=0;i<h.buckets;i++){const items=lines.slice(i*2,i*2+2);for(const l of items){acc.runSub+=l.grossPaise;acc.runDisc+=l.itemDiscPaise;acc.runTaxable+=l.taxablePaise;acc.runTax+=l.taxPaise;acc.runAlloc+=l.allocationPaise;}tx.set(db.doc(ROOT+'/invoices/'+id+'/buckets/'+i),{index:i,items,...acc,createdAt:stamp()});}return h;});}
async function check(name,fn,deny=false){try{await fn();if(deny)throw Error('UNEXPECTED ALLOW');log('PASS '+name);return true}catch(e){if(deny&&e.code==='permission-denied'){log('PASS '+name+' denied');return true}log('FAIL '+name+': '+e.code+' '+e.message);return false;}}
document.getElementById('run').onclick=async function(){this.disabled=true;let pass=0,total=0;const key='test'+Date.now();async function t(name,f,d=false){total++;if(await check(name,f,d))pass++;}
for(const n of [1,4,8,16,32])await t(n+' lines',()=>sale(key+'n'+n,n,{customer:true,odType:'pct',odVal:7.25}));
for(const mode of ['retail','wholesale'])for(const odType of ['pct','amt'])await t(mode+' '+odType,()=>sale(key+mode+odType,8,{mode,odType,odVal:7.25,customer:true}));
for(const [name,fn] of [['price',(h,l)=>l[0].unitPaise=1],['tax',(h,l)=>l[0].taxPaise+=1],['quantity',(h,l)=>l[0].qty=-1],['total',h=>h.grandPaise=0],['customer',h=>h.customer.name='Forged'],['stock',(h,l,a)=>a.stock.p31=0],['counter',(h,l,a)=>a.nextSeq+=1],['extra-field',h=>h.admin=true]])await t(name+' tamper',()=>sale(key+name,8,{customer:true},fn),true);
await t('edit invoice',()=>db.doc(ROOT+'/invoices/'+key+'n1').update({grandPaise:0}),true);
await t('stale stock-only write',()=>db.doc(STATE).update({'stock.p0':999999}),true);
await t('idempotent retry',async()=>{const b=(await db.doc(STATE).get({source:'server'})).data();await sale(key+'n1',1);const a=(await db.doc(STATE).get({source:'server'})).data();if(b.nextSeq!==a.nextSeq||b.stock.p0!==a.stock.p0)throw Error('Duplicate deduction');});
log('RESULT '+pass+'/'+total+' checks passed.');this.disabled=false;};
document.getElementById('cleanup').onclick=async()=>{try{const invoices=await db.collection(ROOT+'/invoices').get();let count=0;for(const s of invoices.docs){const bs=await s.ref.collection('buckets').get();for(const b of bs.docs){await b.ref.delete();count++}await s.ref.delete();count++}await db.doc(STATE).delete();await db.doc(ROOT+'/customers/c1').delete();log('Deleted '+(count+2)+' synthetic documents.')}catch(e){log('Cleanup error: '+e.message)}};
</script>
